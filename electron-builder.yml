appId: app.hantong.desktop
productName: Hantong
directories:
  buildResources: build
files:
  - 'out/**/*'
  - 'resources/**/*'
  - 'package.json'
  - '!**/{.claude,.codex,.agents,.git,.vscode}/**'
  - '!**/{AGENTS.md,CLAUDE.md,DESIGN.md}'
  - '!**/.env'
  - '!**/.env.*'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.productivity
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
